# Auth Gateway Development Docker Compose
#
# Development environment with database and Redis only.
# The application runs locally (via `go run` or `make start-backend`).
#
# Quick Start:
#   1. Configure .env with PostgreSQL DSN:
#      SQL_DSN=postgresql://root:123456@localhost:5432/auth-gateway
#      REDIS_CONN_STRING=redis://localhost:6379/0
#   2. make dev-db (or: docker-compose -f docker-compose.dev.yml up -d)
#   3. go run main.go
#   4. cd web && bun run dev (for frontend hot reload on port 5173)
#
# Using MySQL instead of PostgreSQL:
#   1. Comment out the postgres service
#   2. Uncomment the mysql service
#   3. Update SQL_DSN in .env

version: '3.4'

services:
  redis:
    image: redis:latest
    container_name: redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15
    container_name: postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: auth-gateway
    command: ["postgres", "-c", "log_statement=all", "-c", "log_destination=stderr"]
    volumes:
      - pg_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"

